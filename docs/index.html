<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포카시세 - 아이돌 포토카드 시세 조회</title>
  <meta name="description" content="번개장터, 중고나라의 아이돌 포토카드 시세를 한눈에! BTS, 블랙핑크, 에스파, 뉴진스 등 실시간 포카 시세 무료 조회" />
  <meta property="og:title" content="포카시세 - 아이돌 포토카드 실시간 시세" />
  <meta property="og:description" content="번개장터, 중고나라 포토카드 거래 시세를 자동 수집합니다" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f0fa; color: #222; }

    header {
      background: linear-gradient(135deg, #c678a8 0%, #7c4dff 100%);
      color: white;
      padding: 24px 20px 20px;
      text-align: center;
    }
    header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; }
    header p { margin-top: 6px; font-size: 0.9rem; opacity: 0.85; }
    .last-updated { margin-top: 8px; font-size: 0.78rem; opacity: 0.7; }

    .search-bar {
      display: flex;
      gap: 8px;
      max-width: 560px;
      margin: 18px auto 0;
      padding: 0 16px;
    }
    .search-bar input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
    }
    .search-bar button {
      padding: 12px 20px;
      background: #fff;
      color: #7c4dff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .tabs {
      display: flex;
      gap: 8px;
      max-width: 900px;
      margin: 20px auto 0;
      padding: 0 16px;
      overflow-x: auto;
    }
    .tab {
      padding: 8px 18px;
      border-radius: 20px;
      background: white;
      border: 2px solid #e0d0ee;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab.active { background: #7c4dff; color: white; border-color: #7c4dff; }
    .tab:hover:not(.active) { border-color: #c678a8; color: #c678a8; }

    main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: #555;
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0d0ee;
    }

    /* 시세 카드 그리드 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-card:hover { border-color: #c678a8; transform: translateY(-2px); }
    .stat-card.selected { border-color: #7c4dff; background: #f3eeff; }
    .stat-card .group-name { font-weight: 700; font-size: 0.95rem; color: #333; }
    .stat-card .avg-price { font-size: 1.1rem; font-weight: 700; color: #7c4dff; margin-top: 6px; }
    .stat-card .sub { font-size: 0.75rem; color: #999; margin-top: 2px; }

    /* 멤버 시세 */
    .member-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .member-card {
      background: white;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
    }
    .member-card:hover { border-color: #c678a8; }
    .member-card.selected { border-color: #7c4dff; background: #f3eeff; }
    .member-card .name { font-weight: 700; font-size: 0.9rem; }
    .member-card .price { font-size: 1rem; font-weight: 700; color: #c678a8; margin-top: 4px; }
    .member-card .count { font-size: 0.72rem; color: #aaa; margin-top: 2px; }

    /* 거래 목록 */
    .listings { display: flex; flex-direction: column; gap: 10px; }
    .listing-card {
      background: white;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s;
    }
    .listing-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .listing-img {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
      background: #f0e0f5;
      flex-shrink: 0;
    }
    .listing-img-placeholder {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f0e0f5, #e0d0ee);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }
    .listing-info { flex: 1; min-width: 0; }
    .listing-title {
      font-size: 0.9rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .listing-meta { margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .badge-platform { background: #f0e0f5; color: #c678a8; }
    .badge-group { background: #e8f0fe; color: #4060c8; }
    .badge-member { background: #e8fce8; color: #2a8a2a; }
    .listing-date { font-size: 0.72rem; color: #aaa; }
    .listing-price { font-weight: 700; font-size: 1.05rem; color: #7c4dff; white-space: nowrap; }

    .load-more {
      display: block;
      margin: 24px auto 0;
      padding: 12px 32px;
      background: white;
      border: 2px solid #c678a8;
      color: #c678a8;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .load-more:hover { background: #c678a8; color: white; }

    .empty { text-align: center; color: #aaa; padding: 40px 0; font-size: 0.95rem; }

    .loading { text-align: center; padding: 40px 0; color: #aaa; }
    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #e0d0ee;
      border-top-color: #7c4dff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 500px) {
      header h1 { font-size: 1.4rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header>
  <h1>💜 포카시세</h1>
  <p>아이돌 포토카드 실시간 시세 · 번개장터 · 중고나라</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="아이돌, 멤버, 포카 이름 검색..." />
    <button onclick="doSearch()">검색</button>
  </div>
  <div class="last-updated" id="lastUpdated"></div>
</header>

<div class="tabs" id="groupTabs">
  <div class="tab active" onclick="selectGroup(null, this)">전체</div>
</div>

<main>
  <div class="section-title">그룹별 평균 시세</div>
  <div class="stats-grid" id="statsGrid">
    <div class="loading"><div class="spinner"></div><div>데이터 불러오는 중...</div></div>
  </div>

  <div id="memberSection" style="display:none">
    <div class="section-title" id="memberSectionTitle">멤버별 시세</div>
    <div class="member-grid" id="memberGrid"></div>
  </div>

  <div class="section-title" id="listingTitle">최근 거래글</div>
  <div class="listings" id="listingsContainer"></div>
  <button class="load-more" id="loadMoreBtn" style="display:none" onclick="loadMore()">더 보기</button>
</main>

<script>
let allData = null;
let currentGroup = null;
let currentMember = null;
let currentSearch = "";
let displayedCount = 20;

async function loadData() {
  try {
    const resp = await fetch("data/prices.json");
    allData = await resp.json();
    init();
  } catch (e) {
    document.getElementById("statsGrid").innerHTML = '<div class="empty">데이터를 불러올 수 없습니다. 잠시 후 다시 시도해주세요.</div>';
  }
}

function init() {
  if (!allData) return;

  // 마지막 업데이트
  if (allData.last_updated) {
    document.getElementById("lastUpdated").textContent = `마지막 업데이트: ${allData.last_updated}`;
  }

  renderGroupTabs();
  renderStatsGrid();
  renderListings();
}

function renderGroupTabs() {
  const stats = allData.stats?.groups || {};
  const groups = Object.keys(stats).sort((a, b) => stats[b].count - stats[a].count);
  const tabs = document.getElementById("groupTabs");

  groups.forEach(group => {
    const tab = document.createElement("div");
    tab.className = "tab";
    tab.textContent = group;
    tab.onclick = () => selectGroup(group, tab);
    tabs.appendChild(tab);
  });
}

function selectGroup(group, el) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  currentGroup = group;
  currentMember = null;
  displayedCount = 20;
  renderStatsGrid();
  renderMemberGrid();
  renderListings();
}

function selectMember(member, el) {
  document.querySelectorAll(".member-card").forEach(c => c.classList.remove("selected"));
  if (currentMember === member) {
    currentMember = null;
  } else {
    el.classList.add("selected");
    currentMember = member;
  }
  displayedCount = 20;
  renderListings();
}

function renderStatsGrid() {
  const stats = allData.stats?.groups || {};
  const grid = document.getElementById("statsGrid");

  let groups = Object.entries(stats);
  if (currentGroup) {
    groups = groups.filter(([g]) => g === currentGroup);
  } else {
    groups = groups.sort((a, b) => b[1].count - a[1].count).slice(0, 20);
  }

  if (groups.length === 0) {
    grid.innerHTML = '<div class="empty">데이터가 없습니다</div>';
    return;
  }

  grid.innerHTML = groups.map(([group, s]) => `
    <div class="stat-card ${currentGroup === group ? 'selected' : ''}" onclick="selectGroup('${group}', this)">
      <div class="group-name">${group}</div>
      <div class="avg-price">${s.avg.toLocaleString()}원</div>
      <div class="sub">최저 ${s.min.toLocaleString()} · 거래 ${s.count}건</div>
    </div>
  `).join("");
}

function renderMemberGrid() {
  const section = document.getElementById("memberSection");
  const grid = document.getElementById("memberGrid");

  if (!currentGroup) {
    section.style.display = "none";
    return;
  }

  const memberStats = allData.stats?.members?.[currentGroup] || {};
  const members = Object.entries(memberStats).sort((a, b) => b[1].count - a[1].count);

  if (members.length === 0) {
    section.style.display = "none";
    return;
  }

  document.getElementById("memberSectionTitle").textContent = `${currentGroup} 멤버별 시세`;
  section.style.display = "block";

  grid.innerHTML = members.map(([member, s]) => `
    <div class="member-card ${currentMember === member ? 'selected' : ''}" onclick="selectMember('${member}', this)">
      <div class="name">${member}</div>
      <div class="price">${s.avg.toLocaleString()}원</div>
      <div class="count">거래 ${s.count}건</div>
    </div>
  `).join("");
}

function getFilteredItems() {
  if (!allData?.items) return [];

  return allData.items.filter(item => {
    if (currentGroup && item.group !== currentGroup) return false;
    if (currentMember && item.member !== currentMember) return false;
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      if (!item.title.toLowerCase().includes(q) &&
          !(item.group || "").toLowerCase().includes(q) &&
          !(item.member || "").toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function renderListings() {
  const items = getFilteredItems();
  const container = document.getElementById("listingsContainer");
  const loadMoreBtn = document.getElementById("loadMoreBtn");

  let title = "최근 거래글";
  if (currentMember) title = `${currentMember} 포카 거래글`;
  else if (currentGroup) title = `${currentGroup} 포카 거래글`;
  else if (currentSearch) title = `"${currentSearch}" 검색 결과`;
  document.getElementById("listingTitle").textContent = title;

  const slice = items.slice(0, displayedCount);

  if (slice.length === 0) {
    container.innerHTML = '<div class="empty">거래글이 없습니다</div>';
    loadMoreBtn.style.display = "none";
    return;
  }

  container.innerHTML = slice.map(item => `
    <a class="listing-card" href="${item.link}" target="_blank" rel="noopener">
      ${item.image
        ? `<img class="listing-img" src="${item.image}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="listing-img-placeholder" style="display:none">💜</div>`
        : `<div class="listing-img-placeholder">💜</div>`
      }
      <div class="listing-info">
        <div class="listing-title">${item.title}</div>
        <div class="listing-meta">
          <span class="badge badge-platform">${item.platform}</span>
          ${item.group ? `<span class="badge badge-group">${item.group}</span>` : ""}
          ${item.member ? `<span class="badge badge-member">${item.member}</span>` : ""}
          <span class="listing-date">${item.date || ""}</span>
        </div>
      </div>
      <div class="listing-price">${item.price.toLocaleString()}원</div>
    </a>
  `).join("");

  loadMoreBtn.style.display = items.length > displayedCount ? "block" : "none";
}

function loadMore() {
  displayedCount += 20;
  renderListings();
}

function doSearch() {
  currentSearch = document.getElementById("searchInput").value.trim();
  currentGroup = null;
  currentMember = null;
  displayedCount = 20;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelector(".tab").classList.add("active");
  renderStatsGrid();
  renderMemberGrid();
  renderListings();
}

document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") doSearch();
});

loadData();
</script>
</body>
</html>
