name: 포토카드 시세 자동 수집

on:
  schedule:
    - cron: '0 */6 * * *'   # 6시간마다 (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:         # 수동 실행도 가능

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 시세 수집 실행
        run: python main.py

      - name: 데이터 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices.json
          git diff --staged --quiet || git commit -m "chore: 포토카드 시세 업데이트 [skip ci]"
          git push
